[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timetable-to-calendar"
version = "0.1.0"
description = "Convert timetable images into iCalendar events using OCR."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy",
    "pandas",
    "pytesseract",
    "scikit-learn",
    "ics",
    "pytz",
]

[project.scripts]
timetable = "timetable_converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
